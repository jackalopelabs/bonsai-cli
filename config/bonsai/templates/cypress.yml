sections:
  home_hero:
    component: .hero
    data:
      title: 'Bonsai CLI: Roots Build Tool'
      subtitle: 'Generate a beautful Roots project in minutes'
      description: 'A WordPress CLI tool for generating and managing reusable components, layouts, and sections in Roots-based projects'
      imagePaths: {  }
      buttonText: 'Learn More'
      buttonLink: '#installation'
      secondaryText: Github
      secondaryLink: 'https://github.com/jackalopelabs/bonsai-cli'
      buttonLinkIcon: true
      secondaryIcon: true
      iconMappings: { dropdownIcon: heroicon-s-chevron-down, buttonLinkIcon: heroicon-s-play, secondaryIcon: heroicon-s-arrow-right }
  services_card:
    component: .card
    data:
      sectionId: services
      sectionTitle: Features
      navLinks: { url: /docs, label: Documentation }
      url: '#pricing'
      label: Pricing
      featureItems: [{ icon: heroicon-o-command-line, title: 'Component Generation', description: 'Generate reusable components with a single command.' }]
      icon: heroicon-o-template
      title: 'Template System'
      description: 'Pre-built templates for rapid WordPress development.'
  features_widget:
    component: .widget
    data:
      items: { id: widget-1, title: 'Template System', icon: heroicon-o-template, link: 'https://github.com/jackalopelabs/bonsai-cli' }
      description: 'Comprehensive documentation and configuration guides:'
      listItems: [{ number: '1', itemName: 'Installation & Setup', text: 'Quick installation via Composer and initial project setup' }]
      number: '4'
      itemName: Troubleshooting
      text: 'Common issues, debugging steps, and best practices'
      id: widget-4
      title: Documentation
      icon: heroicon-o-book-open
      cta: { title: Documentation, link: 'https://github.com/jackalopelabs/bonsai-cli' }
  pricing:
    component: .pricing-box
    data:
      title: 'Choose Your Plan'
      subtitle: 'Limited-time pricing available now'
      description: 'Select the plan that best suits your needs. Lock in your price early and keep it forever, or until you cancel.'
      pricingBoxes: [{ icon: heroicon-o-command-line, iconColor: text-gray-400, planType: Bonsai, price: Free }]
      ctaLink: '#buy-sensei'
      ctaText: 'Coming soon'
      ctaColor: 'bg-gradient-to-r from-yellow-500 to-amber-500 text-white'
      iconBtn: heroicon-o-shopping-cart
      iconBtnColor: text-white
      icon: heroicon-o-star
      iconColor: text-yellow-500
      planType: Sensei
      price: '$249<span class=\"text-xs text-gray-400\">/yr</span>'
      features: {  }
layout:
  sections:
    - home_hero
    - services_card
    - features_widget
    - pricing
  settings:
    html:
      attributes: { language_attributes: true, class: no-js, x-data: "{ darkMode: localStorage.getItem('darkMode') === 'true' }", x-init: "darkMode = localStorage.getItem('darkMode') === 'true'; ('darkMode', value => localStorage.setItem('darkMode', value))", 'x-bind:class': "{ 'dark': darkMode }" }
    head:
      meta: {  }
      includes: {  }
    body:
      attributes: { class: 'font-sans antialiased bg-gradient-to-br from-indigo-50 to-blue-100 dark:from-midnight-950 dark:to-midnight-900 min-h-screen transition-colors duration-300' }
      background: { light: { image: images/bonsai_hero_03.png, classes: 'absolute inset-0 w-full h-full object-cover opacity-50 dark:hidden' }, dark: { image: images/bonsai_hero_01.png, classes: 'absolute inset-0 w-full h-full object-cover opacity-50 hidden dark:block' } }
      structure: { app: { class: 'relative z-10', skip_link: { text: 'Skip to content', target: '#main' }, header: { include: bonsai.sections.site_header }, main: { id: main, class: 'max-w-5xl mx-auto', content_wrapper: { class: '{{ $containerInnerClasses }}' } }, footer: { include: bonsai.components.footer } } }
      includes: {  }
