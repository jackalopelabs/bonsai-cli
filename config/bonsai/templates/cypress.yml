sections:
  site_header:
    component: cypress.header
    data:
      siteName: Cypress
      iconComponent: heroicon-o-sparkles
      navLinks: { url: '#features', label: Features }
      url: '#docs'
      label: Documentation
      primaryLink: 'https://cypress.bonsai-cli.com'
      containerClasses: 'max-w-5xl mx-auto'
      containerInnerClasses: px-6
      headerClass: 'bg-indigo-500 bg-opacity-60 backdrop-blur-md shadow-lg border border-transparent rounded-full mx-auto p-1 my-4'
      iconClasses: 'h-8 w-8 mr-2 p-1'
      chevronClasses: 'w-4 h-4 ml-2 inline-block'
      buttonText: Plans
      buttonPrefix: See
      showDarkModeToggle: true
      darkModeToggleClass: ml-4
  home_hero:
    component: cypress.hero
    data:
      title: 'Elevate Your Agency\'
      subtitle: 'Sleek Design Meets Powerful Functionality'
      description: 'Cypress offers a streamlined approach to creating stunning landing pages with the flexibility of no-code editing and developer-friendly tools.'
      imagePaths: {  }
      buttonText: 'Get Started'
      buttonLink: '#pricing'
      secondaryText: 'View Demo'
      secondaryLink: '#demo'
      buttonLinkIcon: true
      secondaryIcon: true
      containerClasses: 'container mx-auto px-4 mb-12 mt-0 md:mt-24'
      columnClasses: 'flex flex-col md:flex-row items-center md:items-start -mx-4'
      imageColumnClasses: 'w-full md:w-1/2 px-4 flex justify-center items-center mt-12 md:mt-0 md:order-last'
      textColumnClasses: 'w-full md:w-1/2 px-4'
      titleClass: 'font-semibold text-6xl'
      productTagClasses: 'bg-white bg-opacity-50 px-3 py-1 text-sm inline-block'
      productIconClasses: 'w-4 h-4 ml-2 inline-block align-middle'
      buttonClasses: 'bg-gradient-to-r from-indigo-500 to-blue-600 text-white text-xl py-2 px-5 rounded-full'
      buttonIconClasses: 'text-white w-6 h-6 ml-2 inline-block align-middle'
      secondaryClasses: 'text-sm bg-transparent px-2 py-1 backdrop-blur-md shadow-lg rounded-md border border-gray-100'
      secondaryIconClasses: 'w-4 h-4 ml-2 inline-block align-middle'
      iconMappings: { dropdownIcon: heroicon-s-chevron-down, buttonLinkIcon: heroicon-s-sparkles, secondaryIcon: heroicon-s-play }
  services_card:
    component: cypress.card
    data:
      sectionId: services
      sectionTitle: '<span class="hidden sm:inline">Our</span> Services'
      navLinks: { url: '#features', label: Features }
      url: '#docs'
      label: Documentation
      sectionClasses: py-12
      containerClasses: 'max-w-4xl mx-auto px-6'
      navContainerClasses: 'flex flex-col sm:flex-row flex-wrap items-start mb-6 justify-center md:justify-center'
      titleClasses: 'text-lg text-gray-700 bg-white p-3 rounded-lg mr-4 mb-4 sm:mb-0'
      titleIconClasses: 'w-4 h-4 ml-2 inline-block align-middle'
      navLinkClasses: 'text-lg text-gray-700 p-3 mb-4 sm:mb-0 hidden sm:inline'
      navLinkIconClasses: 'w-4 h-4 ml-2 inline-block align-middle'
      cardContainerClasses: 'bg-white bg-opacity-50 grid md:grid-cols-2 gap-8 rounded-3xl p-3'
      imageColumnClasses: 'md:w-1/2 mx-auto'
      featuresColumnClasses: 'md:w-2/2 space-y-6'
      featureItemClasses: 'flex items-start space-x-4 bg-white rounded-xl p-3'
      featureIconClasses: 'h-6 w-6 text-indigo-500'
      featureTitleClasses: 'text-lg font-semibold'
      featureDescriptionClasses: 'text-sm text-gray-500'
      featureItems: [{ icon: heroicon-o-command-line, title: 'Component Generation', description: 'Generate reusable components with a single command.' }]
      icon: heroicon-o-template
      title: 'Template System'
      description: 'Pre-built templates for rapid WordPress development.'
  features_widget:
    component: cypress.widget
    data:
      globalStyles: { containerClasses: 'bg-white bg-opacity-30 shadow-lg rounded-xl', contentClasses: p-2, descriptionClasses: 'text-gray-600 text-sm', noteClasses: 'text-gray-600 text-sm', noteLabelClasses: font-bold }
      listItemStyles: { listItemClasses: 'flex items-start py-2', numberClasses: 'flex-shrink-0 flex items-center justify-center text-white mr-4 bg-gray-600 rounded-full w-8 h-8 text-sm', titleClasses: font-semibold, textClasses: 'text-sm text-gray-500' }
      ctaStyles: { containerClasses: 'cta bg-white bg-opacity-50 rounded-lg flex items-center space-x-8 mt-2', imageClasses: 'w-44 h-44 object-cover rounded-xl', contentContainerClasses: 'flex items-center justify-between flex-1', titleClasses: 'text-xl font-semibold', buttonClasses: 'inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50', buttonIconClasses: 'w-4 h-4 ml-2' }
      items: { id: widget-1, title: 'Component Generation', icon: heroicon-o-command-line, link: '#components', imagePath: 'https://placehold.co/600x400/png' }
      description: 'Generate complete WordPress sites from templates:'
      listItems: [{ number: '1', itemName: 'Pre-built Templates', text: 'Start with our collection of ready-to-use templates' }]
      number: '3'
      itemName: 'WordPress Integration'
      text: 'Seamlessly works with WordPress and Sage'
      id: widget-3
      title: 'Template System'
      icon: heroicon-o-template
      cta: { title: 'Template System', link: '#templates', imagePath: 'https://placehold.co/600x400/png' }
  pricing:
    component: cypress.pricing-box
    data:
      pricingBoxStyles: { containerClasses: 'bg-white bg-opacity-50 rounded-xl shadow-lg overflow-hidden mx-auto md:mx-0 text-center my-3 transition-transform transform hover:scale-105', iconClasses: 'inline-block h-12 w-12 mt-8 mb-4', planTypeClasses: text-gray-400, priceClasses: 'text-4xl font-bold', dividerClasses: 'border-t border-gray-200 my-5', featureListClasses: 'my-4 text-left space-y-3', featureItemClasses: 'flex items-center justify-start text-gray-500', featureIconClasses: 'w-5 h-5 mr-2', ctaButtonClasses: 'inline-block py-2 px-6 rounded-full', ctaIconClasses: 'inline-block h-4 w-4 ml-2' }
      title: 'Flexible Pricing Plans'
      subtitle: 'Choose a plan that fits your agency\'
      description: 'All plans include premium support and regular updates. Upgrade anytime to unlock more features.'
      pricingBoxes: [{ icon: heroicon-o-building-storefront, iconColor: text-purple-500, planType: Starter, price: $99 }]
      ctaLink: '#buy-enterprise'
      ctaText: Purchase
      ctaColor: 'bg-gradient-to-r from-yellow-500 to-amber-500 text-white'
      iconBtn: heroicon-o-shopping-cart
      iconBtnColor: text-white
      icon: heroicon-o-globe-americas
      iconColor: text-blue-600
      planType: Enterprise
      price: $799
      features: {  }
layout:
  sections:
    - site_header
    - home_hero
    - services_card
    - features_widget
    - pricing
  settings:
    html:
      attributes: { language_attributes: true, class: 'dark relative h-screen', x-data: "{ darkMode: localStorage.getItem('darkMode') === null ? true : localStorage.getItem('darkMode') === 'true' }", x-init: "$watch('darkMode', val => localStorage.setItem('darkMode', val))", 'x-bind:class': "{ 'dark': darkMode }" }
    head:
      meta: {  }
      includes: [bonsai.components.analytics, utils.styles]
    body:
      attributes: { class: 'transition-colors duration-200 p-0 m-0 bg-transparent' }
      background: { light: { image: images/bonsai_hero_03.png, classes: 'w-full h-full object-cover object-top opacity-100 block dark:hidden' }, dark: { image: images/bonsai_hero_01.png, classes: 'w-full h-full object-cover object-top opacity-100 hidden dark:block' } }
      structure: { app: { class: 'relative z-10', skip_link: { text: 'Skip to content', target: '#main' }, header: { include: bonsai.sections.site_header }, main: { id: main, class: 'max-w-5xl mx-auto', content_wrapper: { class: '{{ $containerInnerClasses }}' } }, footer: { include: bonsai.components.footer } } }
      includes: [utils.scripts]
