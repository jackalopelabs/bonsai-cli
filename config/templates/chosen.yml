layouts:
  chosen:
    sections:
      - site_header
      - home_hero
      - services_card
      - features_widget
      - pricing
      - site_footer

pages:
  home:
    title: "Chōsen - Your Challenge Dashboard"
    layout: chosen
    is_homepage: true
    meta:
      _wp_page_template: templates/template-chosen.blade.php

# WordPress specific configurations
wordpress:
  menus:
    primary_navigation:
      location: "primary_navigation"
      name: "Primary Navigation"
    footer_navigation:
      location: "footer_navigation"
      name: "Footer Navigation"

  theme_support:
    - title-tag
    - post-thumbnails
    - menus
    - gutenberg
    - wide-images
    - responsive-embeds

  image_sizes:
    hero_image:
      width: 2560
      height: 1440
      crop: true
    feature_image:
      width: 800
      height: 600
      crop: true
    testimonial_avatar:
      width: 96
      height: 96
      crop: true

# Asset compilation settings
assets:
  images:
    - chosen_hero_01.webp
    - chosen_hero_03.webp
# Styles and scripts aren't working yet
  # styles:
  #   - resources/css/cypress.scss
  #   - resources/css/editor.scss
  # scripts:
  #   - resources/js/cypress.js
  #   - resources/js/gutenberg.js
  #   - resources/js/alpine.js
