name: Chosen
description: A challenge tracking and accountability platform with gamification features
version: 0.0.1

# Add theme settings at the top level
theme:
  body:
    class: 'dark relative h-screen'
  html:
    class: 'dark relative h-screen'
    x-data: '{ darkMode: localStorage.getItem(''darkMode'') === null ? true : localStorage.getItem(''darkMode'') === ''true'' }'
    x-init: '$watch(''darkMode'', val => localStorage.setItem(''darkMode'', val))'
    x-bind:class: '{ ''dark'': darkMode }'

# ASCII art configuration section
ascii_art:
  default: |
    ${green}                    &
                          && & &
                      & &&&&&&~&&&
                       &&  &&&&  &&
                        &&&~|\&&&
                         &//~\\&
                        |/    \|
                       /|\    /|\
             &&       |//~    ~\\|
               &&    \_/        \_/  && & &
        &&&    &&     //_/____\\_\  /&&&/_&&&
         &&&__&&   \_\_\/~~~~\/\_/   &&&
       & &\&  &&&&\|&  /~||~\  &|     &
        &&& & &    /~~      ~~\
                 ${brown}:____________./~~~\.____:
                  \                         /
                   \_____________________/
                   (_)               (_)${reset}

components:
  - hero
  - header
  - card
  - widget
  - accordion
  - cta
  - list-item
  - pricing-box
  - feature-grid
  - dark-mode-toggle
  - footer

sections:
  site_header:
    component: chosen.header
    data:
      siteName: 'Chōsen'
      iconSvg: '<svg class="h-8 w-8 mr-3" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 12L11 14L15 10M12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      navLinks:
        - url: '/dashboard'
          label: 'Dashboard'
        - url: '/challenges'
          label: 'Challenges'
        - url: '/groups'
          label: 'Groups'
      primaryLink: '/new-challenge'
      containerClasses: 'px-6 flex justify-between items-center w-full'
      headerClass: 'max-w-7xl mx-auto sticky top-0 bg-white/10 dark:bg-midnight-950/20 backdrop-blur-md shadow-lg border border-slate-700/50 rounded-full mx-auto p-1 my-4'
      buttonText: 'New Challenge'
      buttonPrefix: 'Start'
      showDarkModeToggle: true
      darkModeToggleClass: 'p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors duration-200'
      chevronSvg: '<svg class="w-4 h-4 ml-2 inline-block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon"><path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 0 1-1.06 0l-7.5-7.5a.75.75 0 0 1 1.06-1.06L12 14.69l6.97-6.97a.75.75 0 1 1 1.06 1.06l-7.5 7.5Z" clip-rule="evenodd"></path></svg>'

  home_hero:
    component: chosen.hero
    data:
      title: "Challenge Yourself"
      subtitle: "Track your progress, maintain streaks, achieve your goals"
      description: "A challenge tracking platform with accountability partners, stakes, and gamification to help you build better habits"
      buttonText: "Start Challenge"
      buttonLink: "/new-challenge"
      secondaryText: "Learn More"
      secondaryLink: "/how-it-works"
      buttonLinkIcon: true
      secondaryIcon: true
      containerClasses: "container mx-auto px-4 mb-12 mt-0 md:mt-24"
      columnClasses: "flex flex-col md:flex-row items-center md:items-start -mx-4"
      imageColumnClasses: "w-full md:w-1/2 px-4 flex justify-center items-center mt-12 md:mt-0 md:order-last"
      textColumnClasses: "w-full md:w-1/2 px-4"
      titleClass: "font-semibold text-6xl"
      productTagClasses: "bg-white bg-opacity-50 px-3 py-1 text-sm inline-block"
      productIconClasses: "w-4 h-4 ml-2 inline-block align-middle"
      buttonClasses: "bg-gradient-to-r from-indigo-500 to-blue-600 text-white text-xl py-2 px-5 rounded-full"
      buttonIconClasses: "text-white w-6 h-6 ml-2 inline-block align-middle"
      secondaryClasses: "text-sm bg-transparent px-2 py-1 backdrop-blur-md shadow-lg rounded-md border border-gray-100"
      secondaryIconClasses: "w-4 h-4 ml-2 inline-block align-middle"
      iconMappings:
        dropdownIcon: "heroicon-s-chevron-down"
        buttonLinkIcon: "heroicon-s-play"
        secondaryIcon: "heroicon-s-arrow-right"

  services_card:
    component: card
    data:
      sectionId: "features"
      sectionTitle: "Features"
      navLinks: [
        {"url": "/how-it-works", "label": "How It Works"},
        {"url": "#pricing", "label": "Pricing"}
      ]
      # Style classes
      sectionClasses: "py-12"
      containerClasses: "max-w-4xl mx-auto px-6"
      navContainerClasses: "flex flex-col sm:flex-row flex-wrap items-start mb-6 justify-center md:justify-center"
      titleClasses: "text-lg text-gray-700 bg-white p-3 rounded-lg mr-4 mb-4 sm:mb-0"
      titleIconClasses: "w-4 h-4 ml-2 inline-block align-middle"
      navLinkClasses: "text-lg text-gray-700 p-3 mb-4 sm:mb-0 hidden sm:inline"
      navLinkIconClasses: "w-4 h-4 ml-2 inline-block align-middle"
      # Card styles
      cardContainerClasses: "bg-white bg-opacity-50 grid md:grid-cols-2 gap-8 rounded-3xl p-3"
      imageColumnClasses: "md:w-1/2 mx-auto"
      featuresColumnClasses: "md:w-2/2 space-y-6"
      featureItemClasses: "flex items-start space-x-4 bg-white rounded-xl p-3"
      featureIconClasses: "h-6 w-6 text-indigo-500"
      featureTitleClasses: "text-lg font-semibold"
      featureDescriptionClasses: "text-sm text-gray-500"
      featureItems: [
        {
          "icon": "heroicon-o-check-badge",
          "title": "Challenge Tracking",
          "description": "Track daily progress with a kanban-style interface"
        },
        {
          "icon": "heroicon-o-user-group",
          "title": "Accountability Partners",
          "description": "Assign partners to keep you on track with your goals"
        },
        {
          "icon": "heroicon-o-chart-bar",
          "title": "Streak Visualization",
          "description": "GitHub-style activity tracking to gamify your progress"
        }
      ]

  features_widget:
    component: widget
    data:
      globalStyles:
        containerClasses: "bg-white dark:bg-midnight-950 bg-opacity-30 dark:bg-opacity-10 shadow-lg rounded-xl"
        contentClasses: "p-2"
        descriptionClasses: "text-gray-600 dark:text-gray-400 text-sm"
        noteClasses: "text-gray-600 dark:text-gray-400 text-sm"
        noteLabelClasses: "font-bold"
      listItemStyles:
        listItemClasses: "flex items-start py-2"
        numberClasses: "flex-shrink-0 flex items-center justify-center text-white mr-4 bg-gray-600 dark:bg-gray-700 rounded-full w-8 h-8 text-sm"
        contentClasses: ""
        titleClasses: "font-semibold dark:text-gray-200"
        textClasses: "text-sm text-gray-500 dark:text-gray-400"
      ctaStyles:
        containerClasses: "cta bg-white dark:bg-midnight-950 bg-opacity-50 dark:bg-opacity-10 rounded-lg flex items-center space-x-8 mt-2"
        imageClasses: "w-44 h-44 object-cover rounded-xl"
        contentContainerClasses: "flex items-center justify-between flex-1"
        titleClasses: "text-xl font-semibold text-gray-900 dark:text-gray-100"
        buttonClasses: "inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-midnight-950 border border-gray-300 dark:border-gray-700 rounded-md hover:bg-gray-50 dark:hover:bg-opacity-10"
        buttonIconClasses: "w-4 h-4 ml-2"
      items:
        - id: "widget-1"
          title: "Challenge Types"
          icon: "heroicon-o-flag"
          content: ""
          cta:
            title: "Challenge Types"
            link: "/challenges"
            imagePath: "/images/challenge-types.jpg"
            buttonText: "Learn more"
          description: "Choose from various challenge types to match your goals:"
          listItems:
            - number: "1"
              itemName: "Daily Habit"
              text: "Build consistency with daily tasks"
            - number: "2"
              itemName: "Content Creation"
              text: "Track your content creation journey"
            - number: "3"
              itemName: "Custom Challenges"
              text: "Create your own challenge format"
        - id: "widget-2"
          title: "Accountability"
          icon: "heroicon-o-user-group"
          content: ""
          cta:
            title: "Accountability Partners"
            link: "/accountability"
            imagePath: "/images/accountability.jpg"
            buttonText: "Learn more"
          description: "Stay on track with accountability features:"
          listItems:
            - number: "1"
              itemName: "Partner Matching"
              text: "Find the perfect accountability partner"
            - number: "2"
              itemName: "Progress Sharing"
              text: "Share your journey with your partners"
            - number: "3"
              itemName: "Notifications"
              text: "Get reminders and encouragement"
            - number: "4"
              itemName: "Mentor Mode"
              text: "Get guidance from experienced mentors"
        - id: "widget-3"
          title: "Stakes"
          icon: "heroicon-o-banknotes"
          content: ""
          cta:
            title: "Challenge Stakes"
            link: "/stakes"
            imagePath: "/images/stakes.jpg"
            buttonText: "Learn more"
          description: "Add stakes to your challenges for extra motivation:"
          listItems:
            - number: "1"
              itemName: "Financial Stakes"
              text: "Put money on the line to ensure completion"
            - number: "2"
              itemName: "Social Stakes"
              text: "Make public commitments for accountability"
            - number: "3"
              itemName: "Reward System"
              text: "Earn rewards for completing challenges"
        - id: "widget-4"
          title: "Content Groups"
          icon: "heroicon-o-document-text"
          content: ""
          cta:
            title: "Content Groups"
            link: "/groups"
            imagePath: "/images/content-groups.jpg"
            buttonText: "Learn more"
          description: "Streamline your content creation process:"
          listItems:
            - number: "1"
              itemName: "Automatic Publishing"
              text: "Auto-post completed challenge content"
            - number: "2"
              itemName: "Group Feeds"
              text: "Share with like-minded challenge participants"
            - number: "3"
              itemName: "Content Calendar"
              text: "Plan and schedule your content creation"
            - number: "4"
              itemName: "Analytics"
              text: "Track engagement and growth metrics"

  pricing:
    component: pricing-box
    data:
      # Global pricing box styles
      pricingBoxStyles:
        containerClasses: "bg-white bg-opacity-50 rounded-xl shadow-lg overflow-hidden mx-auto md:mx-0 text-center my-3 transition-transform transform hover:scale-105"
        iconClasses: "inline-block h-12 w-12 mt-8 mb-4"
        planTypeClasses: "text-gray-400"
        priceClasses: "text-4xl font-bold"
        dividerClasses: "border-t border-gray-200 my-5"
        featureListClasses: "my-4 text-left space-y-3"
        featureItemClasses: "flex items-center justify-start text-gray-500"
        featureIconClasses: "w-5 h-5 mr-2"
        ctaButtonClasses: "inline-block py-2 px-6 rounded-full"
        ctaIconClasses: "inline-block h-4 w-4 ml-2"

      title: "Choose Your Plan"
      subtitle: "Select the plan that best suits your challenge goals."
      description: "Limited-time pricing available now"
      pricingBoxes:
        - icon: "heroicon-o-flag"
          iconColor: "text-purple-500"
          planType: "Basic"
          price: "Free"
          features:
            - "3 active challenges"
            - "Basic streak tracking"
            - "Public accountability"
            - "Community support"
            - "Basic analytics"
          ctaLink: "/signup"
          ctaText: "Get Started"
          ctaColor: "bg-white"
          iconBtn: "heroicon-o-arrow-right"
          iconBtnColor: "text-gray-500"

        - icon: "heroicon-o-trophy"
          iconColor: "text-indigo-600"
          planType: "Challenger"
          price: "$9/mo"
          features:
            - "Unlimited challenges"
            - "Advanced streak analytics"
            - "Accountability partners"
            - "Financial stakes"
            - "Priority support"
          ctaLink: "#buy-challenger"
          ctaText: "Upgrade"
          ctaColor: "bg-gradient-to-r from-emerald-600 to-green-500 text-white"
          iconBtn: "heroicon-o-arrow-down-on-square"
          iconBtnColor: "text-white"

        - icon: "heroicon-o-star"
          iconColor: "text-blue-600"
          planType: "Champion"
          price: "$19/mo"
          features:
            - "Everything in Challenger"
            - "Content groups"
            - "Auto-publishing"
            - "API access"
            - "White-label options"
          ctaLink: "#buy-champion"
          ctaText: "Go Pro"
          ctaColor: "bg-gradient-to-r from-yellow-500 to-amber-500 text-white"
          iconBtn: "heroicon-o-shopping-cart"
          iconBtnColor: "text-white"

  site_footer:
    component: chosen.footer
    data:
      containerClasses: 'container mx-auto'
      brand:
        iconSvg: '<svg class="h-8 w-8 mr-2 p-1 text-gray-900 dark:text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 12L11 14L15 10M12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        name: 'Chōsen'
        url: 'https://chosen.so'
        classes:
          container: 'flex items-center'
          icon: 'h-8 w-8 mr-2 p-1'
          text: 'font-semibold text-xl tracking-tight text-gray-900 dark:text-white'
      menuGroups:
        - title: 'Features'
          links:
            - url: '/challenges'
              label: 'Challenges'
            - url: '/accountability'
              label: 'Accountability'
            - url: '/stakes'
              label: 'Stakes'
        - title: 'Community'
          links:
            - url: '/groups'
              label: 'Groups'
            - url: '/leaderboard'
              label: 'Leaderboard'
        - title: 'Resources'
          links:
            - url: '/guides'
              label: 'Guides'
            - url: '/api'
              label: 'API'
      socialLinks:
        title: 'Follow Us'
        links:
          - url: 'https://www.youtube.com/@JackalopeLabs'
            label: 'YouTube'
            icon: 'M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z'
          - url: 'https://www.instagram.com/masoninthesis'
            label: 'Instagram'
            icon: 'M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 