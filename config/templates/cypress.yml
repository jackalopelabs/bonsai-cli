      title: "Choose Your Plan"
      subtitle: "Select the plan that best suits your needs. Lock in your price early and keep it forever, or until you cancel."
      description: "Limited-time pricing available now"
      pricingBoxes:
        - icon: "heroicon-o-building-storefront"
          iconColor: "text-purple-500"
          planType: "Starter"
          price: "Free"
          features:
