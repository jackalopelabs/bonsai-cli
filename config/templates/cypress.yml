            - "Cypress Alpha Access"
            - "All components"
            - "Tutorials"
            - "Community support"
          ctaLink: "https://github.com/jackalope-labs/bonsai-cli"
          ctaText: "Github"
          ctaColor: "bg-white"
          iconBtn: "heroicon-o-arrow-right"
          iconBtnColor: "text-gray-500"

        - icon: "heroicon-o-building-office-2"
          iconColor: "text-indigo-600"
          planType: "Professional"
          price: "$99/yr"
          features:
            - "Cypress Theme"
            - "Cypress Components"
            - "Exclusive Content"
            - "Discord Support"
            - "Early access to new features"
          ctaLink: "#buy-professional"
          ctaText: "Coming soon"
          ctaColor: "bg-gradient-to-r from-emerald-600 to-green-500 text-white"
          iconBtn: "heroicon-o-arrow-down-on-square"
          iconBtnColor: "text-white"

        - icon: "heroicon-o-globe-americas"
