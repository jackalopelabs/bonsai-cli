name: Cypress
description: Agency-focused WordPress theme optimized for landing pages with no-code editing capabilities
version: 0.0.1

# Add theme settings at the top level
theme:
  body:
    class: 'dark relative h-screen'
  html:
    class: 'dark relative h-screen'
    x-data: '{ darkMode: localStorage.getItem(''darkMode'') === null ? true : localStorage.getItem(''darkMode'') === ''true'' }'
    x-init: '$watch(''darkMode'', val => localStorage.setItem(''darkMode'', val))'
    x-bind:class: '{ ''dark'': darkMode }'

# ASCII art configuration section
ascii_art:
  default: |
    ${green}                    &
                          && & &
                      & &&&&&&~&&&
                       &&  &&&&  &&
                        &&&~|\&&&
                         &//~\\&
                        |/    \|
                       /|\    /|\
             &&       |//~    ~\\|
               &&    \_/        \_/  && & &
        &&&    &&     //_/____\\_\  /&&&/_&&&
         &&&__&&   \_\_\/~~~~\/\_/   &&&
       & &\&  &&&&\|&  /~||~\  &|     &
        &&& & &    /~~      ~~\
                 ${brown}:____________./~~~\.____:
                  \                         /
                   \_____________________/
                   (_)               (_)${reset}

components:
  - hero
  - header
  - card
  - widget
  - accordion
  - cta
  - list-item
  - pricing-box
  - feature-grid
  - dark-mode-toggle

sections:
  site_header:
    component: cypress.header
    data:
      siteName: 'Bonsai'
      iconSvg: '<svg class="h-8 w-8 mr-3" viewBox="0 0 731 731.2" fill="currentColor"><path d="M647.1 172.7L396 27.7a56.727 56.727 0 0 0-56.9 0l-251 144.9c-17.6 10.2-28.4 28.9-28.4 49.3v289.9c0 20.3 10.8 39.1 28.4 49.3l251 144.9c17.6 10.2 39.3 10.2 56.9 0l251-144.9c17.6-10.2 28.4-28.9 28.4-49.3V222c.1-20.4-10.7-39.2-28.3-49.3zM542.6 447.1c-14.9 16.8-41.5 14.9-52.4 4.3-4.9 2.8-17.9 9.7-31.2 8.3l-96.7 55.5c-1.3.8-2.9 1.2-4.4 1.2h-48.6c-2.5 0-3.4-3.3-1.2-4.6l107.7-62.7c9.7-5.7 9.7-19.7 0-25.4l-41-23.9-32.1-4.7s-98.3 28.5-133.9 12.2c-35.5-16.3-45 0-45 0s-15 13-37.5 3.1c-11.4-15.9 0-25.6 15.2-20.4-1.8-10.1 7.4-13 14.9-20.5-9.1-1.4-7.5-14.2-10.3-22.9-10.4-12.5-1.4-29.1 10.3-29.1-5.7-29.8 11.9-31.6 30-27.7 2.2-28.4 22.6-42.9 52.6-29.9-4.2-41.7 47.8-26 47.8-26s-16-15.5-2.8-26c13.1-10.5 18 0 18 0 16.6-19.5 49.5-4.7 51.2 8.7 1.3-4.6 20.6-4.2 20.6-4.2 36.5-28.2 79.4-4.5 75.3 17.2 63.3-24.8 54.8 56.4 54.8 56.4 14.8-13.5 13.8.6 27.8 8.7 34.9 10.4 19.4 23.5 19.4 23.5 37.7-7.1 59.3 19.9 44 41.1 18.4 11.9 17.9 25 10.5 33.6 6.6 7.2 7.9 19.3-2.8 32.5 4 29.4-28.1 33.4-60.2 21.7z"></path></svg>'
      navLinks:
        - url: '/docs'
          label: 'Docs'
        - url: '/components'
          label: 'Components'
        - url: '/tutorials'
          label: 'Tutorials'
      primaryLink: '#plans'
      containerClasses: 'px-6 flex justify-between items-center w-full'
      headerClass: 'max-w-5xl mx-auto sticky top-0 bg-white/10 dark:bg-midnight-950/20 backdrop-blur-md shadow-lg border border-transparent rounded-full mx-auto p-1 my-4'
      buttonText: 'Plans'
      buttonPrefix: 'See'
      showDarkModeToggle: true
      darkModeToggleClass: 'p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors duration-200'
      chevronSvg: '<svg class="w-4 h-4 ml-2 inline-block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon"><path fill-rule="evenodd" d="M12.53 16.28a.75.75 0 0 1-1.06 0l-7.5-7.5a.75.75 0 0 1 1.06-1.06L12 14.69l6.97-6.97a.75.75 0 1 1 1.06 1.06l-7.5 7.5Z" clip-rule="evenodd"></path></svg>'

  home_hero:
    component: hero
    data:
      # Content
      title: "Elevate Your Agency's Web Presence"
      subtitle: "Sleek Design Meets Powerful Functionality"
      description: "Cypress offers a streamlined approach to creating stunning landing pages with the flexibility of no-code editing and developer-friendly tools."
      imagePaths: ["https://placehold.co/600x400/png"]
      buttonText: "Get Started"
      buttonLink: "#pricing"
      secondaryText: "View Demo"
      secondaryLink: "#demo"
      buttonLinkIcon: true
      secondaryIcon: true
      
      # Style Classes
      containerClasses: "container mx-auto px-4 mb-12 mt-0 md:mt-24"
      columnClasses: "flex flex-col md:flex-row items-center md:items-start -mx-4"
      imageColumnClasses: "w-full md:w-1/2 px-4 flex justify-center items-center mt-12 md:mt-0 md:order-last"
      textColumnClasses: "w-full md:w-1/2 px-4"
      titleClass: "font-semibold text-6xl"
      productTagClasses: "bg-white bg-opacity-50 px-3 py-1 text-sm inline-block"
      productIconClasses: "w-4 h-4 ml-2 inline-block align-middle"
      buttonClasses: "bg-gradient-to-r from-indigo-500 to-blue-600 text-white text-xl py-2 px-5 rounded-full"
      buttonIconClasses: "text-white w-6 h-6 ml-2 inline-block align-middle"
      secondaryClasses: "text-sm bg-transparent px-2 py-1 backdrop-blur-md shadow-lg rounded-md border border-gray-100"
      secondaryIconClasses: "w-4 h-4 ml-2 inline-block align-middle"
      
      # Icons
      iconMappings:
        dropdownIcon: "heroicon-s-chevron-down"
        buttonLinkIcon: "heroicon-s-sparkles"
        secondaryIcon: "heroicon-s-play"

  services_card:
    component: card
    data:
      sectionId: "services"
      sectionTitle: "<span class=\"hidden sm:inline\">Our</span> Services"
      navLinks: [
        {"url": "#features", "label": "Features"},
        {"url": "#docs", "label": "Documentation"}
      ]
      # Style classes
      sectionClasses: "py-12"
      containerClasses: "max-w-4xl mx-auto px-6"
      navContainerClasses: "flex flex-col sm:flex-row flex-wrap items-start mb-6 justify-center md:justify-center"
      titleClasses: "text-lg text-gray-700 bg-white p-3 rounded-lg mr-4 mb-4 sm:mb-0"
      titleIconClasses: "w-4 h-4 ml-2 inline-block align-middle"
      navLinkClasses: "text-lg text-gray-700 p-3 mb-4 sm:mb-0 hidden sm:inline"
      navLinkIconClasses: "w-4 h-4 ml-2 inline-block align-middle"
      # Card styles
      cardContainerClasses: "bg-white bg-opacity-50 grid md:grid-cols-2 gap-8 rounded-3xl p-3"
      imageColumnClasses: "md:w-1/2 mx-auto"
      featuresColumnClasses: "md:w-2/2 space-y-6"
      featureItemClasses: "flex items-start space-x-4 bg-white rounded-xl p-3"
      featureIconClasses: "h-6 w-6 text-indigo-500"
      featureTitleClasses: "text-lg font-semibold"
      featureDescriptionClasses: "text-sm text-gray-500"
      featureItems: [
        {
          "icon": "heroicon-o-command-line",
          "title": "Component Generation",
          "description": "Generate reusable components with a single command."
        },
        {
          "icon": "heroicon-o-puzzle-piece",
          "title": "Section Builder",
          "description": "Create and manage page sections with dynamic data."
        },
        {
          "icon": "heroicon-o-template",
          "title": "Template System",
          "description": "Pre-built templates for rapid WordPress development."
        }
      ]

  features_widget:
    component: widget
    data:
      globalStyles:
        containerClasses: "bg-white dark:bg-midnight-950 bg-opacity-30 dark:bg-opacity-10 shadow-lg rounded-xl"
        contentClasses: "p-2"
        descriptionClasses: "text-gray-600 dark:text-gray-400 text-sm"
        noteClasses: "text-gray-600 dark:text-gray-400 text-sm"
        noteLabelClasses: "font-bold"
      listItemStyles:
        listItemClasses: "flex items-start py-2"
        numberClasses: "flex-shrink-0 flex items-center justify-center text-white mr-4 bg-gray-600 dark:bg-gray-700 rounded-full w-8 h-8 text-sm"
        contentClasses: ""
        titleClasses: "font-semibold dark:text-gray-200"
        textClasses: "text-sm text-gray-500 dark:text-gray-400"
      ctaStyles:
        containerClasses: "cta bg-white dark:bg-midnight-950 bg-opacity-50 dark:bg-opacity-10 rounded-lg flex items-center space-x-8 mt-2"
        imageClasses: "w-44 h-44 object-cover rounded-xl"
        contentContainerClasses: "flex items-center justify-between flex-1"
        titleClasses: "text-xl font-semibold text-gray-900 dark:text-gray-100"
        buttonClasses: "inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-midnight-950 border border-gray-300 dark:border-gray-700 rounded-md hover:bg-gray-50 dark:hover:bg-opacity-10"
        buttonIconClasses: "w-4 h-4 ml-2"
      items:
        - id: "widget-1"
          title: "Template System"
          icon: "heroicon-o-template"
          content: ""
          cta:
            title: "Template System"
            link: "#templates"
            imagePath: "https://bonsai.so/dist/images/template-system_v01.adb3a1.png"
            buttonText: "Learn more"
          description: "Generate complete WordPress sites from templates:"
          listItems:
            - number: "1"
              itemName: "Bonsai Template"
              text: "Clean, lightweight, and modern"
            - number: "2"
              itemName: "Cypress Template"
              text: "Glassy, modern, and beautiful"
            - number: "3"
              itemName: "Custom Templates"
              text: "Create your own templates for reuse"
        - id: "widget-2"
          title: "Component Library"
          icon: "heroicon-o-command-line"
          content: ""
          cta:
            title: "Component Generation"
            link: "#components"
            imagePath: "https://bonsai.so/dist/images/component-generation_v01.92fb24.png"
            buttonText: "Learn more"
          description: "Generate and manage reusable components with ease:"
          listItems:
            - number: "1"
              itemName: "Quick Setup"
              text: "Initialize your project with bonsai:init"
            - number: "2"
              itemName: "Component Library"
              text: "Access pre-built components ready for customization"
            - number: "3"
              itemName: "Component Generation"
              text: "Create new components with simple commands"
            - number: "4"
              itemName: "Custom Components"
              text: "Create your own components with simple commands"
        - id: "widget-3"
          title: "Section Builder"
          icon: "heroicon-o-puzzle-piece"
          content: ""
          cta:
            title: "Section Builder"
            link: "#sections"
            imagePath: "https://bonsai.so/dist/images/section-builder_v01.143d17.png"
            buttonText: "Learn more"
          description: "Build dynamic page sections with powerful features:"
          listItems:
            - number: "1"
              itemName: "Dynamic Data"
              text: "Configure sections using YAML files"
            - number: "2"
              itemName: "Reusable Sections"
              text: "Create once, use anywhere in your site"
            - number: "3"
              itemName: "Flexible Layout"
              text: "Combine sections into custom page layouts"
        - id: "widget-4"
          title: "Documentation"
          icon: "heroicon-o-menu"
          content: ""
          cta:
            title: "Documentation"
            link: "#documentation"
            imagePath: "https://bonsai.so/dist/images/documentation_v01.dfc82e.png"
            buttonText: "Learn more"
          description: "Comprehensive documentation and configuration guides:"
          listItems:
            - number: "1"
              itemName: "Installation & Setup"
              text: "Quick installation via Composer and initial project setup"
            - number: "2"
              itemName: "Command Reference"
              text: "Full documentation of all CLI commands and options"
            - number: "3"
              itemName: "Configuration Guide"
              text: "Detailed YAML configuration and template system guides"
            - number: "4"
              itemName: "Troubleshooting"
              text: "Common issues, debugging steps, and best practices"

  pricing:
    component: pricing-box
    data:
      # Global pricing box styles
      pricingBoxStyles:
        containerClasses: "bg-white bg-opacity-50 rounded-xl shadow-lg overflow-hidden mx-auto md:mx-0 text-center my-3 transition-transform transform hover:scale-105"
        iconClasses: "inline-block h-12 w-12 mt-8 mb-4"
        planTypeClasses: "text-gray-400"
        priceClasses: "text-4xl font-bold"
        dividerClasses: "border-t border-gray-200 my-5"
        featureListClasses: "my-4 text-left space-y-3"
        featureItemClasses: "flex items-center justify-start text-gray-500"
        featureIconClasses: "w-5 h-5 mr-2"
        ctaButtonClasses: "inline-block py-2 px-6 rounded-full"
        ctaIconClasses: "inline-block h-4 w-4 ml-2"

      title: "Flexible Pricing Plans"
      subtitle: "Choose a plan that fits your agency's needs"
      description: "All plans include premium support and regular updates. Upgrade anytime to unlock more features."
      pricingBoxes:
        - icon: "heroicon-o-building-storefront"
          iconColor: "text-purple-500"
          planType: "Starter"
          price: "$99"
          features:
            - "3 site licenses"
            - "All premium features"
            - "Visual builder access"
            - "Standard support"
            - "Regular updates"
          ctaLink: "#buy-starter"
          ctaText: "Purchase"
          ctaColor: "bg-white"
          iconBtn: "heroicon-o-arrow-right"
          iconBtnColor: "text-gray-500"

        - icon: "heroicon-o-building-office-2"
          iconColor: "text-indigo-600"
          planType: "Professional"
          price: "$299"
          features:
            - "10 site licenses"
            - "White labeling"
            - "Priority support"
            - "Client management tools"
            - "Advanced templates"
            - "Early access to new features"
          ctaLink: "#buy-professional"
          ctaText: "Purchase"
          ctaColor: "bg-gradient-to-r from-emerald-600 to-green-500 text-white"
          iconBtn: "heroicon-o-shopping-cart"
          iconBtnColor: "text-white"

        - icon: "heroicon-o-globe-americas"
          iconColor: "text-blue-600"
          planType: "Enterprise"
          price: "$799"
          features:
            - "Unlimited site licenses"
            - "All Professional features"
            - "Custom development services"
            - "VIP support"
            - "Dedicated account manager"
            - "1-on-1 training sessions"
            - "Custom integrations"
          ctaLink: "#buy-enterprise"
          ctaText: "Purchase"
          ctaColor: "bg-gradient-to-r from-yellow-500 to-amber-500 text-white"
          iconBtn: "heroicon-o-shopping-cart"
          iconBtnColor: "text-white"

layouts:
  cypress:
    sections:
      - site_header
      - home_hero
      - services_card
      - features_widget
      - pricing

pages:
  home:
    title: "Cypress - Agency WordPress Theme"
    layout: cypress
    is_homepage: true
    meta:
      _wp_page_template: templates/template-cypress.blade.php

# WordPress specific configurations
wordpress:
  menus:
    primary_navigation:
      location: "primary_navigation"
      name: "Primary Navigation"
    footer_navigation:
      location: "footer_navigation"
      name: "Footer Navigation"

  theme_support:
    - title-tag
    - post-thumbnails
    - menus
    - gutenberg
    - wide-images
    - responsive-embeds

  image_sizes:
    hero_image:
      width: 2560
      height: 1440
      crop: true
    feature_image:
      width: 800
      height: 600
      crop: true
    testimonial_avatar:
      width: 96
      height: 96
      crop: true

# Asset compilation settings
assets:
  images:
    - bonsai_hero_01.png
    - bonsai_hero_03.png
  styles:
    - resources/styles/cypress.scss
    - resources/styles/editor.scss
  scripts:
    - resources/scripts/cypress.js
    - resources/scripts/gutenberg.js
    - resources/scripts/alpine.js
